<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF4F6" />
      <stop offset="50%" stop-color="#F4F8FA" />
      <stop offset="100%" stop-color="#E2EEF2" />
    </linearGradient>

    <!-- Subtle radial glow behind phone -->
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5E8E5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EAF4F6" stop-opacity="0" />
    </radialGradient>

    <!-- Phone shadow -->
    <filter id="phoneShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0F172A" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>

    <!-- Button subtle shadow -->
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="800" fill="url(#bgGrad)" />
  <circle cx="500" cy="400" r="380" fill="url(#phoneGlow)" />

  <!-- Phone Container (Centered, Width 330, Height 680) -->
  <g transform="translate(335, 60)" filter="url(#phoneShadow)">
    <!-- Outer Phone Chassis Border -->
    <rect x="0" y="0" width="330" height="680" rx="48" fill="#18181B" stroke="#27272A" stroke-width="4" />
    
    <!-- Inner Phone Screen Area -->
    <rect x="7" y="7" width="316" height="666" rx="42" fill="#F8F9FA" />

    <!-- Clip Path for Screen Content -->
    <clipPath id="screenClip">
      <rect x="7" y="7" width="316" height="666" rx="42" />
    </clipPath>

    <g clip-path="url(#screenClip)">
      <!-- Dynamic Island / Speaker Notch -->
      <rect x="123" y="15" width="84" height="24" rx="12" fill="#000000" />
      
      <!-- Status Bar: Time (9:41) & Icons -->
      <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#09090B">9:41</text>
      
      <!-- Right Status Bar Icons: Signal, Wifi, Battery -->
      <g transform="translate(254, 22)" fill="#09090B">
        <!-- Signal Bars -->
        <rect x="0" y="8" width="2.5" height="4" rx="0.5" />
        <rect x="4" y="6" width="2.5" height="6" rx="0.5" />
        <rect x="8" y="3" width="2.5" height="9" rx="0.5" />
        <rect x="12" y="0" width="2.5" height="12" rx="0.5" />
        
        <!-- Wifi Icon -->
        <path d="M22 2 A 8 8 0 0 1 32 2 M24 5 A 5 5 0 0 1 30 5 M26 8 A 2 2 0 0 1 28 8" stroke="#09090B" stroke-width="1.5" stroke-linecap="round" fill="none" />
        
        <!-- Battery Pill -->
        <rect x="36" y="1" width="18" height="10" rx="3" fill="none" stroke="#09090B" stroke-width="1.5" />
        <rect x="38" y="3" width="11" height="6" rx="1.5" fill="#09090B" />
        <path d="M55 4.5 C 55.5 4.5, 56 4.9, 56 5.5 L 56 6.5 C 56 7.1, 55.5 7.5, 55 7.5" fill="#09090B" />
      </g>

      <!-- History Icon (Clock with Arrow) -->
      <g transform="translate(32, 65)">
        <circle cx="10" cy="10" r="8" fill="none" stroke="#09090B" stroke-width="1.8" />
        <path d="M10 6 L 10 10 L 13 12" stroke="#09090B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M5 6 L 5 9 L 8 9" stroke="#09090B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Expression Display: "25 × 45 =" -->
      <text x="296" y="145" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="17" font-weight="500" fill="#71717A">25 × 45 =</text>

      <!-- Large Main Result: "1,125" -->
      <text x="296" y="215" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="46" font-weight="700" fill="#09090B" letter-spacing="-1">1,125</text>

      <!-- Backspace Icon Button [⌫] -->
      <g transform="translate(268, 255)">
        <rect x="0" y="0" width="28" height="20" rx="5" fill="none" stroke="#71717A" stroke-width="1.5" />
        <path d="M9 10 L 19 10 M12 6 L 8 10 L 12 14" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Keypad Grid Starting at Y=305 -->
      <!-- Row 1: AC, (), %, ÷ -->
      <!-- AC (Vibrant Teal Accent Button) -->
      <rect x="24" y="305" width="58" height="52" rx="18" fill="#3DBBB0" filter="url(#btnShadow)" />
      <text x="53" y="337" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">AC</text>

      <!-- ( ) (Soft Pastel Mint) -->
      <rect x="94" y="305" width="58" height="52" rx="18" fill="#E2F0ED" filter="url(#btnShadow)" />
      <text x="123" y="337" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="18" font-weight="600" fill="#1C2E38">( )</text>

      <!-- % (Soft Pastel Mint) -->
      <rect x="164" y="305" width="58" height="52" rx="18" fill="#E2F0ED" filter="url(#btnShadow)" />
      <text x="193" y="337" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="18" font-weight="600" fill="#1C2E38">%</text>

      <!-- ÷ (Soft Pastel Mint) -->
      <rect x="234" y="305" width="58" height="52" rx="18" fill="#E2F0ED" filter="url(#btnShadow)" />
      <text x="263" y="338" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="22" font-weight="600" fill="#1C2E38">÷</text>

      <!-- Row 2: 7, 8, 9, × -->
      <!-- 7 (Dark Navy Slate) -->
      <rect x="24" y="372" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="53" y="404" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">7</text>

      <!-- 8 (Dark Navy Slate) -->
      <rect x="94" y="372" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="123" y="404" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">8</text>

      <!-- 9 (Dark Navy Slate) -->
      <rect x="164" y="372" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="193" y="404" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">9</text>

      <!-- × (Soft Pastel Mint) -->
      <rect x="234" y="372" width="58" height="52" rx="18" fill="#E2F0ED" filter="url(#btnShadow)" />
      <text x="263" y="404" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="22" font-weight="600" fill="#1C2E38">×</text>

      <!-- Row 3: 4, 5, 6, − -->
      <!-- 4 -->
      <rect x="24" y="439" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="53" y="471" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">4</text>

      <!-- 5 -->
      <rect x="94" y="439" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="123" y="471" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">5</text>

      <!-- 6 -->
      <rect x="164" y="439" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="193" y="471" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">6</text>

      <!-- − -->
      <rect x="234" y="439" width="58" height="52" rx="18" fill="#E2F0ED" filter="url(#btnShadow)" />
      <text x="263" y="471" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="24" font-weight="600" fill="#1C2E38">−</text>

      <!-- Row 4: 1, 2, 3, + -->
      <!-- 1 -->
      <rect x="24" y="506" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="53" y="538" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">1</text>

      <!-- 2 -->
      <rect x="94" y="506" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="123" y="538" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">2</text>

      <!-- 3 -->
      <rect x="164" y="506" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="193" y="538" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">3</text>

      <!-- + -->
      <rect x="234" y="506" width="58" height="52" rx="18" fill="#E2F0ED" filter="url(#btnShadow)" />
      <text x="263" y="538" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="22" font-weight="600" fill="#1C2E38">+</text>

      <!-- Row 5: 0 (wide), ., = -->
      <!-- 0 (Wide Pill spanning 2 column spaces) -->
      <rect x="24" y="573" width="128" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <text x="88" y="605" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">0</text>

      <!-- . (Dot) -->
      <rect x="164" y="573" width="58" height="52" rx="18" fill="#1E2430" filter="url(#btnShadow)" />
      <circle cx="193" cy="603" r="3" fill="#FFFFFF" />

      <!-- = (Equals in Soft Pastel Mint) -->
      <rect x="234" y="573" width="58" height="52" rx="18" fill="#E2F0ED" filter="url(#btnShadow)" />
      <text x="263" y="605" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="24" font-weight="600" fill="#1C2E38">=</text>

      <!-- iOS Home Indicator Pill -->
      <rect x="98" y="652" width="134" height="4.5" rx="2.25" fill="#09090B" />
    </g>
  </g>
</svg>
